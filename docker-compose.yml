services:
  postgres:
    image: postgres:15-alpine
    container_name: agentra_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-2004}
      POSTGRES_DB: ${POSTGRES_DB:-Agentra_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: agentra_redis
    restart: always
    ports:
      - "6379:6379"

  auth-service:
    build:
      context: ./backend/services/auth
    container_name: agentra_auth
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-2004}@postgres:5432/${POSTGRES_DB:-Agentra_db}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-DN48wjkTjoL2dEmoBCrY9qE5nYP8ZAt9c0Fd6nPyiE4=}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-multiagentai-e8c08}
    depends_on:
      - postgres
      - redis

  chat-service:
    build:
      context: ./backend/services/chat
    container_name: agentra_chat
    restart: always
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-2004}@postgres:5432/${POSTGRES_DB:-Agentra_db}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  agent-service:
    build:
      context: ./backend/services/agent
    container_name: agentra_agent
    restart: always
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - CHAT_SERVICE=http://chat-service:8002
      - AUTH_SERVICE=http://auth-service:8001
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
    depends_on:
      - chat-service
      - auth-service
      - redis

  gateway-service:
    build:
      context: ./backend/getaway
    container_name: agentra_gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service:8001
      - CHAT_SERVICE_URL=http://chat-service:8002
      - AGENT_SERVICE_URL=http://agent-service:8003
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-DN48wjkTjoL2dEmoBCrY9qE5nYP8ZAt9c0Fd6nPyiE4=}
      - JWT_ALGORITHM=HS256
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:80}
    depends_on:
      - auth-service
      - chat-service
      - agent-service

  frontend:
    build:
      context: ./frontend
    container_name: agentra_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - gateway-service

volumes:
  postgres_data:
